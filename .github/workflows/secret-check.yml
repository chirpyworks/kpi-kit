name: Secret checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout full reachable history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test the local prevention guard
        run: python3 scripts/security/test_secret_guard.py
      - name: Check tracked credential paths and common patterns
        run: python3 scripts/security/check_secrets.py
      - name: Pull the official pinned scanner
        run: docker pull ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
      - name: Verify scanner positive and negative controls
        run: python3 scripts/security/scanner_smoke.py
      - name: Scan reachable Git history with built-in rules
        run: |
          docker run --rm --network=none --read-only \
            --cap-drop=ALL --security-opt=no-new-privileges \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --config=/repo/.github/security/gitleaks.toml \
            --log-opts="--all" --redact=100 --no-banner --log-level=error \
            --ignore-gitleaks-allow
